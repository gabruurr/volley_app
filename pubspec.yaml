name: volley_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3


flutter_icons:
  android: true
  ios: true
  image_path: "assets/ball.png" 


flutter:
 fonts:
   - family: ConcertOne
     fonts:
       - asset: assets/fonts/ConcertOne-Regular.ttf
      

 assets:
  - assets/ball.png
  - assets/fonts/
 uses-material-design: true
